- insert:
    - id: preset-evolution
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: evolution
        name: SparkVolve
        description: Evidence-driven plugin evolution with independent experiments
        plugins:
          - id: evolution-native-authoring
            name: '@sparkvolve/dsh-bundle/native-authoring'
          - id: evolution-tools
            name: '@sparkvolve/dsh-bundle'
            config:
              endpoint: !!js process.env.SPARKVOLVE_ENDPOINT
              tokenEnv: SPARKVOLVE_TOKEN
