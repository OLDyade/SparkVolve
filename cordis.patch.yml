- insert:
    - id: preset-evolution
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: evolution
        name: Harness Evolution
        description: Evidence-driven plugin evolution with independent experiments
        plugins:
          - id: evolution-native-authoring
            name: '@harness-evolution/dsh-bundle/native-authoring'
          - id: evolution-tools
            name: '@harness-evolution/dsh-bundle'
            config:
              endpoint: !!js process.env.EVOLUTION_ENDPOINT
              tokenEnv: EVOLUTION_TOKEN
