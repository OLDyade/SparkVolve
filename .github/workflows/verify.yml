name: Verify native evolution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm run test:install
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - run: docker build -t harness-evolution:test .
      - run: HE_TEST_IMAGE=$(docker image inspect harness-evolution:test --format '{{.Id}}') npm run test:container
