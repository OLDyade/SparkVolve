name: Verify native evolution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts-and-native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm run test:install
  containers:
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, he-runsc-20261019]
    runs-on: ubuntu-latest
    env:
      HE_TEST_RUNTIME: ${{ matrix.runtime }}
      TMPDIR: ${{ runner.temp }}/harness-evolution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install -g npm@12.2.0
      - run: npm ci
      - name: Prepare evidence directory
        run: mkdir -p "$TMPDIR"
      - name: Install pinned gVisor runtime
        if: matrix.runtime == 'he-runsc-20261019'
        run: bash scripts/install-runsc.sh
      - run: docker build -t harness-evolution:test .
      - name: Exercise declared runtime end to end
        run: |
          set -euo pipefail
          HE_TEST_IMAGE=$(docker image inspect harness-evolution:test --format '{{.Id}}') \
            npm run test:container 2>&1 | tee "$TMPDIR/acceptance.log"
      - name: Retain logs and isolation receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.runtime }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harness-evolution/acceptance.log
            ${{ runner.temp }}/harness-evolution/**/isolation*.json
          if-no-files-found: warn
          retention-days: 14
